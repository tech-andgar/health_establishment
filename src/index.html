<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4CAF50">
  <title>Establecimientos de Sanidad Militar del Ejército</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/main.js"></script>
</head>

<body>
  <header>
    <h1>Establecimientos de Sanidad Militar del Ejército</h1>
    <div class="header-controls">
      <div class="view-controls">
        <button id="view-list-btn" class="view-control-btn" title="Ver solo lista">Lista</button>
        <button id="view-both-btn" class="view-control-btn active" title="Ver lista y mapa">Ambos</button>
        <button id="view-map-btn" class="view-control-btn" title="Ver solo mapa">Mapa</button>
      </div>
      <button id="info-button" class="info-button" title="Información">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </button>
    </div>
  </header>
  <main class="container">
    <div class="panel left-panel" id="list-section">
      <div class="filters-toggle">
        <button id="toggle-filters" class="toggle-button">
          <span class="toggle-icon">▼</span>
          <span class="toggle-text">Mostrar filtros</span>
        </button>
      </div>
      <div class="filters" style="display: none;">
        <div class="filters-row">
          <div class="search-field">
            <label for="filter-input">Búsqueda:</label>
            <div class="input-with-icon">
              <input type="text" id="filter-input" placeholder="Buscar establecimientos...">
              <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="#4CAF50" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <button type="button" id="clear-search" class="clear-input" title="Limpiar búsqueda">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="#999" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="city-search">
            <label for="city-autocomplete">Ciudad:</label>
            <div class="input-with-icon">
              <input type="text" id="city-autocomplete" list="cities-list" placeholder="Buscar ciudad...">
              <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="#4CAF50" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <button type="button" id="clear-city" class="clear-input" title="Limpiar filtro">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="#999" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <datalist id="cities-list">
              <!-- Las opciones se generarán con JavaScript -->
            </datalist>
          </div>
          <div class="type-filter">
            <label for="establishment-type">Tipo de establecimiento:</label>
            <div class="input-with-icon">
              <input type="text" id="establishment-type" list="type-list" placeholder="Seleccionar tipo...">
              <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="#4CAF50" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <button type="button" id="clear-type" class="clear-input" title="Limpiar filtro">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="#999" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <datalist id="type-list">
              <option value="">Todos los tipos</option>
              <option value="Dispensario">Dispensario</option>
              <option value="Consultorio">Consultorio</option>
              <option value="Centro">Centro</option>
              <option value="Escuela">Escuela</option>
              <option value="Establecimiento de Sanidad">Establecimiento de Sanidad</option>
              <option value="Batallón de Infantería">Batallón de Infantería</option>
              <option value="Batallón de Artillería">Batallón de Artillería</option>
              <option value="Batallón de Ingenieros">Batallón de Ingenieros</option>
              <option value="Batallón de A.S.P.C">Batallón de A.S.P.C</option>
              <option value="Batallón de Alta Montaña">Batallón de Alta Montaña</option>
              <option value="Batallón de Selva">Batallón de Selva</option>
              <option value="Batallón de Transportes">Batallón de Transportes</option>
              <option value="Batallón de Instrucción">Batallón de Instrucción</option>
              <option value="Grupo de Caballería">Grupo de Caballería</option>
              <option value="Puesto de Mando">Puesto de Mando</option>
            </datalist>
          </div>
        </div>
      </div>
      <div class="list-container">
        <ul id="establishment-list">
          <!-- List items will be generated by JavaScript -->
        </ul>
      </div>
    </div>
    <div class="divider">
      <div class="divider-handle"></div>
    </div>
    <div class="panel right-panel" id="map-section">
      <h2>Mapa</h2>
      <div id="map"></div>
    </div>
  </main>

  <!-- Modal de información -->
  <div id="info-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>Información</h3>
      <div class="info-content">
        <p><strong>Fuente de datos:</strong> <a href="https://www.datos.gov.co/api/views/fgfq-enis/rows.pdf"
            target="_blank">Plataforma Nacional de Datos Abiertos - Ejercito Nacional de Colombia</a></p>
        <p><strong>Desarrollado por:</strong> Andres García (TECH-ANDGAR) <a href="https://github.com/tech-andgar"
            target="_blank">GitHub</a> & AI (Anthropic, OpenAI, Google)</p>
        <p><strong>Última actualización:</strong> <span id="update-date">Abril 2025</span></p>
      </div>
    </div>
  </div>


</body>

</html>
