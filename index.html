<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <title>Establecimientos de Sanidad Militar del Ejército</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Establecimientos de Sanidad Militar del Ejército</h1>
        <button id="info-button" class="info-button" title="Información">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        </button>
    </header>
    <main class="container">
        <aside id="list-section" class="section">
            <h2>Listado</h2>
            <div class="filters">
                <div class="search-field">
                    <label for="filter-input">Búsqueda:</label>
                    <div class="input-with-icon">
                        <input type="text" id="filter-input" placeholder="Buscar establecimientos...">
                        <span class="search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <button type="button" id="clear-search" class="clear-input" title="Limpiar búsqueda">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="filter-controls">
                    <div class="city-search">
                        <label for="city-autocomplete">Ciudad:</label>
                        <div class="input-with-icon">
                            <input type="text" id="city-autocomplete" list="cities-list" placeholder="Buscar ciudad...">
                            <span class="search-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </span>
                            <button type="button" id="clear-city" class="clear-input" title="Limpiar filtro">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <datalist id="cities-list">
                            <!-- Las opciones se generarán con JavaScript -->
                        </datalist>
                    </div>
                </div>
            </div>
            <div class="list-container">
                <ul id="establishment-list">
                    <!-- List items will be generated by JavaScript -->
                </ul>
            </div>
            <!-- Botón flotante contextual para el listado -->
            <button id="toggle-view-btn" class="floating-btn view-toggle-btn" title="Cambiar vista">
                <svg id="toggle-view-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <rect x="8" y="10" width="8" height="8" rx="1"></rect>
                    <path d="M3 10h18"></path>
                </svg>
            </button>
        </aside>
        <section id="map-section" class="section">
            <h2>Mapa</h2>
            <!-- Botón contextual para el mapa (reemplaza múltiples botones) -->
            <button id="view-control-btn" class="floating-btn map-control-btn" title="Cambiar vista">
                <svg id="view-control-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div id="map"></div>
        </section>
    </main>
    
    <!-- Modal de información -->
    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Información</h3>
            <div class="info-content">
                <p><strong>Fuente de datos:</strong> <a href="https://www.ejercito.mil.co/servicio_ciudadano/red_de_sanidad" target="_blank">Ejercito Nacional de Colombia</a></p>
                <p><strong>Desarrollado por:</strong> Sección de Desarrollo Web - Ejército Nacional</p>
                <p><strong>Última actualización:</strong> <span id="update-date">Abril 2023</span></p>
            </div>
        </div>
    </div>
    
    <!-- Your Data -->
    <script src="data.js"></script> <!-- Make sure this path is correct -->
    <!-- Custom JavaScript -->
    <script src="index.js"></script>
</body>
</html>
