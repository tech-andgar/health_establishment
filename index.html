<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <title>Establecimientos de Sanidad Militar del Ejército</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Establecimientos de Sanidad Militar del Ejército</h1>
    </header>
    <main class="container">
        <aside id="list-section" class="section">
            <h2>Listado</h2>
            <div class="filters">
                <input type="text" id="filter-input" placeholder="Buscar establecimientos...">
                <div class="filter-controls">
                    <div class="city-search">
                        <input type="text" id="city-autocomplete" list="cities-list" placeholder="Buscar ciudad...">
                        <datalist id="cities-list">
                            <!-- Las opciones se generarán con JavaScript -->
                        </datalist>
                    </div>
                </div>
            </div>
            <div class="list-container">
                <ul id="establishment-list">
                    <!-- List items will be generated by JavaScript -->
                </ul>
            </div>
        </aside>
        <section id="map-section" class="section">
            <h2>Mapa</h2>
            <button id="toggle-list" class="toggle-list" title="Mostrar/Ocultar listado">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div id="map"></div>
        </section>
    </main>
    <!-- Your Data -->
    <script src="data.js"></script> <!-- Make sure this path is correct -->
    <!-- Custom JavaScript -->
    <script src="index.js"></script>
</body>
</html>
